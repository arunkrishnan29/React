<!DOCTYPE html>
<html>
<body>

<button onclick="sendData()">Send Data</button>

<script>
function sendData() {
    fetch('http://localhost:3000', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({
            name: 'John Doe',
            age: 30
        })
    })
    .then(response => response.text())
    .then(text => console.log(text))
    .catch(error => console.error('Fetch error:', error));
}
</script>

</body>
</html>
