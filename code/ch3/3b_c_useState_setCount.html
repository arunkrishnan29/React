<!--
3b. Using React. useState(), save a count. The count should have an
initial value of O, and React. useState() should return 2 values:
count (the current data) and setCount (the updater function).
• Update the text in the button so it displays the count instead of O.
• When clicking the button, use the updater function to increase
the count by 1. Click the button a few times to test your code.


3c.print the counts inside the button asaa button name
-->



<!DOCTYPE html>
<html>
  <head>
    <title>React Basics</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>

    <script type="text/babel">
function App(){
  let [count,setCount]=React.useState(0);
  return(
        <div>
          <button onClick={() =>{ setCount(prev => prev + 1)
                                  click()}}>
        Clicked  {count} times</button>
        </div>
  );}
  
  function click(){
      console.log(`Clicked Times`);
}


      const container = document.querySelector('.js-container');
      const root=ReactDOM.createRoot(container);
      
      root.render(<App/>);

    </script> 
  </body>
</html>
