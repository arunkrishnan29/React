<!--
3e. Make both counters display the same count. You can do this by lifting
the state up, and sharing it between the counters.
-->


<!DOCTYPE html>
<html>
  <head>
    <title>React Basics</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>

    <script type="text/babel">

  //start=0 where should the number will start

function Counter({count,inc}){
  
  return(
    <div>
      <button onClick={inc} >
        Clicked  {count} {count<=1? "time":"times"}</button>
      </div>
      );
    }
    
    
    function App(){
      
      const [count,setCount]=React.useState(0);
      
      function increasecount(){
        setCount(count + 1);
      }
      return(
        <div>

    <Counter count={count} inc={increasecount}/>
    <Counter count={count} inc={increasecount}/>

  </div>
);
}






      const container = document.querySelector('.js-container');
      const root=ReactDOM.createRoot(container);
      
      root.render(<App/>);

    </script> 
  </body>
</html>
