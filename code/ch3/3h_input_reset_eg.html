3h. Add 2 buttons beside the ‹input>, "Reset" and "Example".
• When clicking the Reset button, it removes the text in the < input›
• When clicking the Example button, it sets an example text in the
‹ input>, like "Alice" (or any name you want).
• Hint: use a controlled input.
-->


<!DOCTYPE html>
<html>
  <head>
    <title>React Basics</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>

    <script type="text/babel">

function App(){
        const [text,setText]=React.useState();
    
        function reset(){
            setText("");
    }
      function sample(){
            setText("--------Your Typed messages will appear here--------");
      }

return(
  <div>
  <input id="ip" placeholder="typehere" type="text" value={text} onChange={(e)=> setText(e.target.value)}/>

  <button onClick={sample}>Sample</button>
  <button onClick={reset}>Reset</button>

  
  <p>{text}</p>
  </div>
);}




      const container = document.querySelector('.js-container');
      const root=ReactDOM.createRoot(container);
      
      root.render(<App/>);

    </script> 
  </body>
</html>
