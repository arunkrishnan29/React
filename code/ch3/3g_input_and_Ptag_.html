<!--
We'll create a display-as-you-type app.
3g. Start from an empty React website and create an ‹input> and a ‹p>.
As you type in the ‹input›, the text you type should also appear in
the <p› with "Hello " in front of it. (Hint: use onChange, save the text in
state, and insert it in the JSX).

-->


<!DOCTYPE html>
<html>
  <head>
    <title>React Basics</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>

    <script type="text/babel">

function App(){
        const [text,setText]=React.useState();

return(
  <div>
  <input id="e" placeholder="typehere" type="text" onChange={(e)=> setText(e.target.value)}/>
  <p>{text}</p>
  </div>
);}




      const container = document.querySelector('.js-container');
      const root=ReactDOM.createRoot(container);
      
      root.render(<App/>);

    </script> 
  </body>
</html>
