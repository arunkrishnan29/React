2i. JavaScript has a feature called the ternary operator:
const result = valuel ? value2 : value3;
If value1 is true, then the result is value2. Else, the result is value3.
- This lets us insert an if-else statement directly in the JSX.
- Update the previous exercise to use a ternary operator in the JSX.
-->



<!DOCTYPE html>
<html>
  <head>
    <title>React Basics</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>
<script type="text/babel">

function ProductDetails(props){
        return(
          <div>
            <div>
                <p>{props.productName}</p>
            </div>

            <div>
              {props.productDiscountPrice ?
                <>
                <p><del>price: ₹{props.productPrice}</del></p>
                <p>Discount Price: ₹{props.productDiscountPrice}</p>
                </>:
                <p>price: ₹{props.productPrice}</p>
              }
              <button> Add to Cart</button>
            </div>
          </div>
            );
      }
function App(){
  return(
    <div>
      <ProductDetails
        productName="Cotton Socks"
        productPrice={82.91}
        productDiscountPrice={75.45}
      />
      <ProductDetails
        productName="Tennis Balls"
        productPrice={65.80}
      />
      <ProductDetails
        productName="Plain Tshirt"
        productPrice={212.90}
      />
    </div>
  );
}

      const container = document.querySelector('.js-container');
      const root=ReactDOM.createRoot(container);
      
      root.render(<App/>);

    </script> 
  </body>
</html>
