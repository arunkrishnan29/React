<!--
2g. Continuing from 2f, some products can have
a discount. Add a prop to ‹ProductDetails›
called discountprice. If discountPrice exists,
display it under the original price.
- Give the socks product a discount price of $5.45
Cotton socks
Price: $10.90
Discount price: $5.45
Add to Cart |
-->

<!DOCTYPE html>
<html>
  <head>
    <title>React Basics</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>
<script type="text/babel">

function ProductDetails(props){
        return(
          <div>
            <div>
                <p>{props.productName}</p>
            </div>
            <div>
                <p>price: ₹{props.productPrice}</p>
            </div>
            <div>
              {props.productDiscountPrice && (
                <p>Discount Price: ₹{props.productDiscountPrice}</p>
              )}
          </div>
            <div>
              <button> Add to Cart</button>
            </div>
          </div>
            );
      }
function App(){
  return(
    <div>
      <ProductDetails
        productName="Cotton Socks"
        productPrice={82.90}
        productDiscountPrice={5.45}
      />
      <ProductDetails
        productName="Tennis Balls"
        productPrice={65.80}
      />
      <ProductDetails
        productName="Plain Tshirt"
        productPrice={212.90}
      />
    </div>
  );
}

      const container = document.querySelector('.js-container');
      const root=ReactDOM.createRoot(container);
      
      root.render(<App/>);

    </script> 
  </body>
</html>
