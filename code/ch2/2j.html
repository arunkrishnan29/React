<!--
2j. We'll add an image at the top of each Product. In your browser, go to
supersimple.dev/images/_(replace_with cotton-socks.png,
tennis-balls.png, and plain-t-shirt. png). Download the images.
- In ‹ProductDetails› add an ‹img> at the top, and add a prop called
imageSrc. Give the <img> the attribute src={imageSrc} (this sets the
src attribute to the value of the imagesre prop).
- Then in <App›, give each ‹ProductDetails› a prop imagesrc="_"
(replace with the file name of the image, like cotton-socks. png)
-->




<!DOCTYPE html>
<html>
  <head>
    <title>React Basics</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>
<script type="text/babel">

function ProductDetails(props){
        return(
          <div>
            <div>
              <img src={props.imageSrc} width="150" />
              <p>{props.productName}</p>
            </div>

            <div>
              {props.productDiscountPrice ?
                <>
                <p><del>price: ₹{props.productPrice}</del></p>
                <p>Discount Price: ₹{props.productDiscountPrice}</p>
                </>:
                <p>price: ₹{props.productPrice}</p>
              }
              <button> Add to Cart</button>
            </div>
          </div>
            );
      }
function App(){
  return(
    <div>
      <ProductDetails
        imageSrc= "images/socks.png"
        productName="Cotton Socks"
        productPrice={82.91}
        productDiscountPrice={75.45}
      />
      <ProductDetails
        imageSrc= "images/tennisball.png"
        productName="Tennis Ball"
        productPrice={40.80}
      />
      <ProductDetails
       imageSrc= "images/tshirt.png"
        productName="Plain Tshirt"
        productPrice={212.90}
      />
    </div>
  );
}

      const container = document.querySelector('.js-container');
      const root=ReactDOM.createRoot(container);
      
      root.render(<App/>);

    </script> 
  </body>
</html>
