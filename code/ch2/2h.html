<!--
2h. If a product has a discountPrice also cross out the original price.
- To cross out text, surround it with the element: <del>...</del>
- Don't cross out the original price if there's no
Cotton socks
discount. To check if discountPrice does not exist,
use !discountPrice
- There are several ways to do this exercise. As long
Priee: $10.90
Discount price: $5.45
as you get the final result, you're good!
Add to Cart
-->



<!DOCTYPE html>
<html>
  <head>
    <title>React Basics</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>
<script type="text/babel">

function ProductDetails(props){
        return(
          <div>
            <div>
                <p>{props.productName}</p>
            </div>
            <div>
              {props.productDiscountPrice && (
                <>
                <del><p>price: ₹{props.productPrice}</p></del>
                <p>Discount Price: ₹{props.productDiscountPrice}</p>
                </>
                )}
            </div>
            <div>
              {!props.productDiscountPrice &&( 
                <p>Price: ₹{props.productPrice}</p>
              )}
          </div>
            <div>
              <button> Add to Cart</button>
            </div>
          </div>
            );
      }
function App(){
  return(
    <div>
      <ProductDetails
        productName="Cotton Socks"
        productPrice={82.91}
        productDiscountPrice={75.45}
      />
      <ProductDetails
        productName="Tennis Balls"
        productPrice={65.80}
      />
      <ProductDetails
        productName="Plain Tshirt"
        productPrice={212.90}
      />
    </div>
  );
}

      const container = document.querySelector('.js-container');
      const root=ReactDOM.createRoot(container);
      
      root.render(<App/>);

    </script> 
  </body>
</html>
