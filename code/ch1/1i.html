<!DOCTYPE html>
<html>
  <head>
    <title>React Basics</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>


    <script type="text/babel">
      let name="Arunkrishnan";
      let price=10;
      let sockPrice=10;
      let tshirtPrice=8;
      let shippingCost=5;
      let totalCost=shippingCost+sockPrice+tshirtPrice*2;
      console.log(totalCost);
      let date=(dayjs().format('DD MMMM YYYY'));
      let time=(dayjs().format('HH: mm: ss'));
      console.log(date);
      console.log(time);
      const content=(
      <div >
        <p>Sock:  ₹ {sockPrice} </p>
        <p>Tshirt:  ₹ {tshirtPrice} </p>
        <p>ShippingCost:  ₹ {shippingCost} </p>
        <p>Total:  ₹ {totalCost} </p>
        <p> Today is {date} </p>
        <p> Current Time  {time} </p>

        <button> Place the order </button> 
      </div>
      );
      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(content);

    </script>
  </body>
</html>
