<!--
DATE TIME UPDATE
-->



<!--
1j. We'll create a clock. Continue from exercise li and do these steps:
• First, instead of doing ReactDOM. createRoot(...). render (...);
save the root in a variable const root = ReactDOM.createRoot(...);
and then do root. render (...);
• Use the JavaScript code: setInterval(() = { ... }, 1000);
(replace ... with some code and it will run this code every second).
• Inside setInterval, display the current time
on the website using root. render (...);
(setInterval will run this code every second
and this will create a clock).
-->


<!DOCTYPE html>
<html>
  <head>
    <title>React Basics</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>


    <script type="text/babel">

      const date=(dayjs().format('DD MMMM YYYY'));
      console.log(date);
      const content = (
        <div>
        <p> Today is {date} </p>
        <p> Current Time  {dayjs().format('HH:mm:ss')} </p>
        </div>
        );
      const container = document.querySelector('.js-container');
      const root=ReactDOM.createRoot(container);
      root.render(content);

      setInterval(() => {
      
      const time=(dayjs().format('HH:mm:ss'));
      console.log(time);
      const content=(
      <div >
        <p> Today is {date} </p>
        <p> Current Time  {time} </p>
      </div>
      );
      root.render(content);
    },1000)
          
    </script>
  </body>
</html>
