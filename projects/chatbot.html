
<!DOCTYPE html>
<html>
<head>
<title>Chatbot</title>
<style>
  body{
    font-family: Arial, Helvetica, sans-serif;
    background:lavender;
  }
  .send-button{
    background-color:#551a8b;
    padding :12px 20px;
    margin: 12px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    cursor:pointer;
    color:aliceblue
  }
  .chat-input{
    padding: 12px 15px;
    border-radius: 10px;
    border-width: 1px ;
    font-size: 15px;
    flex-grow: 1;
  }
  .chat-input-container{
    display: flex;
  }

.app-container {
  max-width: 700px;
  margin-left: auto;
  margin-right: auto;
  height: 90vh;
  display: flex;
  flex-direction: column-reverse; /* Reverses order so messages go on top and input at bottom */
  justify-content: flex-end;
  overflow: hidden;   /*Anything extending beyond the rounded corners gets clipped, so child elements won't spill outside.*/
  border-radius: 18px;  
  
}
  .chat-message-user{
    display: flex;
    justify-content: flex-end;
    align-items: center;
  }
  .chat-message-robot{
    display: flex;
    align-items: center;
  }
  .chat-message-text{
    background-color:#a571d6;
    color: #000;
    padding: 15px 20px;
    border-radius: 10px;
    margin-right:10px ;
    margin-left: 10px;
    margin-bottom: 20px;
    max-width: 300px;
  }

  .chat-message-profile{
     width: 45px;
     height: 45px;
     border-radius: 50%;
  }

</style>
</head>
<body>
<div class="js-container"></div>

<script src="https://unpkg.com/supersimpledev/react.js"></script>
<script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

<script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

<script src="https://unpkg.com/supersimpledev/babel.js"></script>
<script type="text/babel">
function ChatInput({ chatMessages, setChatMessages }) {
const [inputText, setInputText] = React.useState('');
const [isLoading, setIsLoading] = React.useState(false);

function saveInputText(event) {
setInputText(event.target.value);
        }

async function sendMessage() {
  if (isLoading|| inputText==='' ) 
  {  
    return;
  }
const newChatMessages = [
...chatMessages,
    {
message: inputText,
sender: 'user',
id: crypto.randomUUID()
    }
  ];

setChatMessages(newChatMessages);
setInputText('');
setIsLoading(true);

const response = await Chatbot.getResponseAsync(inputText);
setIsLoading(false);

setChatMessages([
...newChatMessages,
    {
message: response,
sender: 'robot',
id: crypto.randomUUID()
    }
  ]);
}
const handleOnKeydown=(event)=>{
if(event.key ==='Enter'){
sendMessage();
            }
else if(event.key ==='Escape'){
setInputText('');
            }
          }

return (
<div className="chat-input-container">
<input
className="chat-input"
placeholder="Send a message to Chatbot"
size="30"
onChange={saveInputText}
value={inputText}
onKeyDown={handleOnKeydown}

/>
<button
onClick={sendMessage}
className="send-button"
>Send</button>
{isLoading && <p>Loading..</p>}
</div>
        );
      }

function ChatMessage({ message, sender }) {
// const message = props.message;
// const sender = props.sender;
// const { message, sender } = props;

/*
        if (sender === 'robot') {
          return (
            <div>
              <img src="robot.png" width="50" />
              {message}
            </div>
          );
        }
        */

return (
<div className={
  sender ==='user' 
  ?'chat-message-user'
  :'chat-message-robot'
}>
{sender === 'robot' && (
<img className='chat-message-profile' src="robot.png"  />
            )}
            <div className='chat-message-text'>
              {message}
            </div>
{sender === 'user' && (
<img className='chat-message-profile' src="user.png" />
            )}
</div>
        );
      }

function ChatMessages({ chatMessages }) {
return (
<>
{chatMessages.map((chatMessage) => {
return (
<ChatMessage
message={chatMessage.message}
sender={chatMessage.sender}
key={chatMessage.id}
/>
              );
            })}
</>
        );
      }

function App() {
const [chatMessages, setChatMessages] = React.useState([{
message: 'hello chatbot',
sender: 'user',
id: 'id1'
        }, {
message: 'Hello! How can I help you?',
sender: 'robot',
id: 'id2'
        }, {
message: 'can you get me todays date?',
sender: 'user',
id: 'id3'
        }, {
message: 'Today is September 27',
sender: 'robot',
id: 'id4'
        }]);
// const [chatMessages, setChatMessages] = array;
// const chatMessages = array[0];
// const setChatMessages = array[1];

return (
<div className="app-container">
<ChatInput
chatMessages={chatMessages}
setChatMessages={setChatMessages}
/>
<ChatMessages
chatMessages={chatMessages}
/>
</div>
        );
      }

const container = document.querySelector('.js-container');
const root= ReactDOM.createRoot(container);
root.render(<App />);
</script>
</body>
</html>
